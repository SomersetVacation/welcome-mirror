<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="refresh" content="120" />
  <title>Welcome</title>
  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --border:#333;
      --card:rgba(255,255,255,.06);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: clamp(16px, 4vw, 48px);
      text-align:center;
    }

    .card{
      width: min(920px, 92vw);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: clamp(20px, 4vw, 44px);
      background: var(--card);
    }

    h1{
      margin: 0 0 clamp(16px, 3vw, 28px);
      font-size: clamp(42px, 5vw, 72px);
      line-height:1.1;
    }

    .row{
      margin: clamp(10px, 2vw, 18px) 0;
      font-size: clamp(22px, 2.6vw, 36px);
      line-height:1.25;
      word-break: break-word;
    }

    .footer{
      margin-top: clamp(16px, 3vw, 28px);
      font-size: clamp(16px, 2vw, 22px);
      opacity:.85;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Welcome 👋</h1>
      <div class="row"><strong>Guest:</strong> John &amp; Sarah</div>
      <div class="row"><strong>Wi-Fi:</strong> SunshineStay</div>
      <div class="row"><strong>Password:</strong> relax2025</div>
      <div class="row"><strong>Checkout:</strong> 10:00 AM</div>
      <div class="footer">Enjoy your stay 🌴</div>
    </div>
  </div>
</body>
</html>
