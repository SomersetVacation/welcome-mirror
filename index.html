<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="refresh" content="120">
  <title>Welcome</title>

  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: Arial, Helvetica, sans-serif;
    }
    .container {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }
    .card {
      border: 1px solid #333;
      border-radius: 20px;
      padding: 40px;
      max-width: 900px;
      background: rgba(255,255,255,0.05);
    }
    h1 {
      font-size: 64px;
      margin-bottom: 30px;
    }
    .row {
      font-size: 34px;
      margin: 20px 0;
    }
    .footer {
      font-size: 20px;
      opacity: 0.8;
      margin-top: 30px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Welcome 👋</h1>
      <div class="row"><strong>Guest:</strong> John & Sarah</div>
      <div class="row"><strong>Wi-Fi:</strong> SunshineStay</div>
      <div class="row"><strong>Password:</strong> relax2025</div>
      <div class="row"><strong>Checkout:</strong> 10:00 AM</div>
      <div class="footer">Enjoy your stay 🌴</div>
    </div>
  </div>
</body>
</html>
