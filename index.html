<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta http-equiv="refresh" content="120" />
  <title>Welcome</title>

  <style>
    :root{
      --bg:#000;
      --fg:#fff;
      --border:#333;
      --card:rgba(255,255,255,.06);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container{
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: clamp(16px, 4vw, 48px);
      text-align:center;
    }

    .card{
      width: min(980px, 94vw);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: clamp(24px, 4vw, 48px);
      background: var(--card);
    }

    h1{
      margin: 0 0 clamp(18px, 3vw, 30px);
      font-size: clamp(42px, 5vw, 72px);
      line-height:1.1;
    }

    .message{
      font-size: clamp(20px, 2.4vw, 32px);
      line-height: 1.45;
      margin: 20px 0;
      opacity: 0.95;
    }

    .message p{
      margin: 14px 0;
    }

    /* QR + link row */
    .manual{
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin-top: 24px;
      flex-wrap: wrap;
    }

    .manual img{
      width: 120px;
      height: 120px;
      background: white;
      padding: 10px;
      border-radius: 12px;
    }

    .link{
      font-size: clamp(18px, 2.2vw, 28px);
      max-width: 600px;
    }

    .link a{
      color: #9fd4ff;
      text-decoration: none;
      word-break: break-all;
    }

    .link a:hover{
      text-decoration: underline;
    }

    .footer{
      margin-top: clamp(22px, 3vw, 34px);
      font-size: clamp(18px, 2vw, 24px);
      opacity: .85;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="card">
      <h1>Welcome Kerry & Lou </h1>

      <div class="message">
        <p>
          Thank you for booking our holiday house to chill and enjoy the lake.
       </p>
        <p>
          The house manual is located below 
        </p>

        <div class="manual">
          <!-- QR code -->
          <img
            src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=https://app.box.com/s/83wgorf90f8tje2ekfyohpcy8gcly4yi"
            alt="House Manual QR Code"
          >

         </div>

        <p>
          Any questions, please message or call us on<br>
          <strong>📞 0484&nbsp;624&nbsp;879</strong>
        </p>
      </div>

      <div class="footer">
        Enjoy your stay <br>
        <strong>Ruth &amp; Michael</strong>
      </div>
    </div>
  </div>
</body>
</html>
